name: release-sim
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "push = push merge into production, pr = open PR into production"
        required: true
        default: push
      source:
        description: "branch to release"
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.mode }}" = push ]; then
            git checkout production
            git merge --no-ff "origin/${{ inputs.source }}" -m "sim release ${{ inputs.source }}"
            git push origin production
            echo "RESULT=push-ok"
          else
            gh pr create --base production --head "${{ inputs.source }}" --title "sim release ${{ inputs.source }}" --body sim
            echo "RESULT=pr-opened"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
